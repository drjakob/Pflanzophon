# /etc/asound.conf – USB-Hörer als Standardgerät MIT automatischer Abtastraten-Umrechnung
#
# WICHTIG: "type hw" macht KEINE Umrechnung. ElevenLabs öffnet das Mikrofon mit 16000 Hz,
# der USB-Hörer kann aber meist nur 44100/48000 Hz -> "Invalid sample rate".
# "plughw" rechnet Abtastrate, Format und Kanalzahl automatisch um.
#
# Die Karte wird über ihren NAMEN ("Device") angesprochen, nicht über die Nummer,
# weil sich die Nummer (1, 2, ...) nach einem Neustart ändern kann.
# Name prüfen mit:  arecord -l   ->  "card 2: Device [USB Audio Device]"  -> Name = Device

pcm.!default {
    type asym
    playback.pcm "usb_hoerer"
    capture.pcm  "usb_hoerer"
}

pcm.usb_hoerer {
    type plug
    slave.pcm "hw:CARD=Device,DEV=0"
    # Hochwertige Abtastraten-Umrechnung (16000 Hz -> 44100/48000 Hz).
    # Der Standard "linear" klingt blechern/rauschig.
    # Benötigt:  sudo apt install libasound2-plugins
    # Fehlt das Paket, wird automatisch auf "linear" zurückgefallen.
    rate_converter [ "speexrate_best" "samplerate_best" "speexrate" "linear" ]
}

ctl.!default {
    type hw
    card Device
}
